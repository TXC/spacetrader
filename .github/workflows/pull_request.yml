name: Pull Request

on:
  pull_request:
  # Also run by release.yml, so a release passes the same checks.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: pnpm

      - name: Install dependencies
        #run: pnpm install
        run: pnpm clean-install

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: pnpm audit signatures

      - name: Playwright Install
        run: pnpm exec playwright install chromium

      # The same command a developer runs locally before pushing.
      - name: Check
        run: pnpm run check
